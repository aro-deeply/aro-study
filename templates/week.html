<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F5E8E4">
<link rel="manifest" href="/aro-study/manifest.json">
<link rel="apple-touch-icon" href="/aro-study/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/aro-study/assets/icons/icon-192.png">
<title>{{TITLE}} · HR STUDY</title>
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}} · HR STUDY">
<meta property="og:description" content="{{DATE_LABEL}} 모임 기록">
<meta property="og:url" content="https://aro-deeply.github.io/aro-study/weeks/{{SESSION_ID}}/">
<meta property="og:image" content="https://aro-deeply.github.io/aro-study/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<!--
  주차 페이지 템플릿. weeks/<YYYY-MM-DD>/index.html 로 복제해서 쓴다.
  치환할 자리: {{SESSION_ID}} {{WEEK_NO}} {{DATE_LABEL}} {{TITLE}} {{CONTENT}} {{NEXT_PLAN}}
  정적 HTML에 두는 것: 제목, 날짜, 그날 다룬 내용 요약, 관련 브리프 링크, 다음 모임 계획.
  이름·금액·의견·참석자·관련 자료는 전부 Firestore에서 읽는다. 여기 하드코딩하지 않는다.
  관련 브리프가 있으면 CONTENT 안에 아래 카드 형식으로 넣는다.
  <a class="brief-link" href="https://aro-deeply.github.io/aro-briefs/briefs/YYYY-MM-DD-slug/" target="_blank" rel="noopener">
    <span class="k">CASE BRIEF 00</span><span class="t">브리프 제목</span><span class="go">브리프 열기</span></a>
  금지: em dash, 이모지, 세리프 폰트.
-->
<body data-session="{{SESSION_ID}}" data-week="{{WEEK_NO}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cal" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></symbol>
  <symbol id="i-users" viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.5-2.3 2.3-3.5 4.5-3.5s4 1.2 4.5 3.5M11 3.2a2.5 2.5 0 0 1 0 4.6M12.5 10.3c1.1.5 1.8 1.6 2 3.2"/></symbol>
  <symbol id="i-mic" viewBox="0 0 16 16"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14.5"/></symbol>
</defs></svg>
<header class="hero"><div class="w">
  <div id="topbar"></div>
  <div class="pagehead"><div class="k">모임 기록</div><h1>{{TITLE}}</h1></div>
</div></header>

<div class="w">
  <div class="body">
    <main class="col">
      <section class="sec" data-m style="--o:2">
        <h2>이날의 내용</h2>
        <div class="card">
          <div class="doc" id="content">
{{CONTENT}}
          </div>
          <div class="prep" id="next-plan"><b>다음 모임</b><span>{{NEXT_PLAN}}</span></div>
        </div>
      </section>
      <section class="sec" data-m style="--o:3">
        <h2>관련 자료 <small id="res-count"></small></h2>
        <div class="card" id="resources"><div class="empty">불러오는 중</div></div>
      </section>
      <section class="sec" data-m style="--o:5">
        <h2>의견 <small id="comment-count"></small></h2>
        <div class="card" id="comments"><div class="empty">불러오는 중</div></div>
      </section>
    </main>
    <aside class="col side">
      <div class="card" id="info" data-m style="--o:1">
        <div class="ir"><span class="tile"><svg class="i"><use href="#i-cal"/></svg></span><div class="tx"><b id="info-date">{{DATE_LABEL}}</b><span id="info-time"></span></div></div>
        <div class="ir"><span class="tile" id="info-av"><svg class="i"><use href="#i-mic"/></svg></span><div class="tx"><b id="presenter">발제 미정</b></div></div>
        <div class="ir"><span class="tile"><svg class="i"><use href="#i-users"/></svg></span><div class="tx"><b id="att-count">불러오는 중</b><span id="attendees">참석</span></div></div>
      </div>
      <section class="sec" data-m style="--o:4">
        <h2>비용</h2>
        <div id="settle"></div>
      </section>
    </aside>
  </div>
  <div class="foot"><span>HR STUDY</span><span>조직과 사람을 읽고, 질문하고, 나누다</span></div>
</div>

<script type="module">
  import { ready, esc, memberName, honor, avatar, $ } from "../../assets/app.js";
  import { mountCost } from "../../assets/settle.js";
  import { bindCopy } from "../../assets/fund.js";
  import { mountReader, mountComments } from "../../assets/reader.js";
  import { mountResources } from "../../assets/resources.js";

  const sessionId = document.body.dataset.session || location.pathname.split("/").filter(Boolean).slice(-1)[0];
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const { me } = await ready();
  mountComments({ sessionId, me, root: $("#comments"), countEl: $("#comment-count") });
  mountResources({ sessionId, me, root: $("#resources"), countEl: $("#res-count") });
  mountReader({ sessionId, me, root: $("#content") });
  const data = await mountCost($("#settle"), sessionId, { me });
  bindCopy($("#settle"));
  const s = data?.session;
  const [y, m, d] = String(s?.date || sessionId).split("-").map(Number);
  if (y && m && d) {
      $("#info-date").textContent = `${m}월 ${d}일 ${WD[new Date(y, m - 1, d).getDay()]}요일`;
  }
  const when = [s?.time, s?.place].filter(Boolean).join(" · ");
  if (when) $("#info-time").textContent = when; else $("#info-time").remove();
  if (s?.presenter) { $("#presenter").textContent = `발제 ${honor(memberName(s.presenter))}`; $("#info-av").innerHTML = avatar(s.presenter, "lg"); }
  const att = s?.attendees || [];
  $("#att-count").textContent = att.length ? `참석 ${att.length}명` : (s ? "참석 미정" : "세션 정보 없음");
  $("#attendees").textContent = att.length ? att.map(memberName).join(", ") : "참석";
  // 정적 계획이 비어 있으면 Firestore의 nextPlan, 그것도 없으면 줄을 숨긴다.
  const np = $("#next-plan span");
  if (np && !np.textContent.trim()) { if (s?.nextPlan) np.textContent = s.nextPlan; else $("#next-plan").remove(); }
  document.addEventListener("aro:me", () => location.reload());
</script>
</body></html>
