<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAFAF7">
<link rel="manifest" href="/aro-study/manifest.json">
<link rel="apple-touch-icon" href="/aro-study/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/aro-study/assets/icons/icon-192.png">
<title>HR STUDY · 모임 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .week.nopage{cursor:default}
  .week.nopage:hover{border-color:var(--line);transform:none}
  .settle-block{margin-bottom:28px}
  .settle-block h3{margin:0 0 10px;font-size:1rem}
  .month-pick{margin:0 0 18px}
  .month-pick .chip{cursor:pointer}
  .month-pick .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
  .mini .stat b{font-size:1.125rem}
  @media (max-width:560px){.mini{grid-template-columns:1fr 1fr}.mini .stat:last-child{grid-column:auto}}
  h2.tabh{margin-top:26px}
</style>
</head><body>
<div id="topbar"></div>
<div class="wrap">
  <div class="kicker"><span>HR STUDY</span><span>모임 기록</span></div>
  <h1>모임 기록</h1>
  <p class="sub">모임 기록, 일정, 회비, 정산. 이름과 금액은 로그인한 멤버에게만 보임.</p>
  <div id="note"></div>

  <div class="stats four" id="stats">
    <div class="stat"><b class="soft">…</b><span>다음 모임</span></div>
    <div class="stat"><b class="soft">…</b><span>발제</span></div>
    <div class="stat"><b class="soft">…</b><span>회비 잔액</span></div>
    <div class="stat"><b class="soft">…</b><span>이달 가용</span></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="summary" class="on" type="button">요약</button>
    <button data-t="months" type="button">월별</button>
    <button data-t="fund" type="button">회비</button>
    <button data-t="schedule" type="button">일정·발제</button>
  </div>

  <!-- 요약 -->
  <section data-tab="summary" class="on">
    <div id="sum-next"></div>
    <div id="sum-notes"></div>
    <h2 class="tabh">최근 모임 <span class="cnt" id="sum-count"></span></h2>
    <div id="sum-weeks"><div class="empty">불러오는 중</div></div>
  </section>

  <!-- 월별 -->
  <section data-tab="months">
    <div class="chips month-pick" id="month-pick"></div>
    <div id="month-view"></div>
  </section>

  <!-- 회비 -->
  <section data-tab="fund">
    <h2 class="tabh">회비 현황 <span class="cnt" id="fund-sub"></span></h2>
    <p class="secsub">월별 가용 금액 안에서 쓰고, 덜 쓴 금액은 다음 달로 이월됨.</p>
    <div id="fund"><div class="empty">불러오는 중</div></div>
  </section>

  <!-- 일정·발제 -->
  <section data-tab="schedule">
    <h2 class="tabh">일정과 발제 <span class="cnt" id="sched-sub"></span></h2>
    <p class="secsub">발제는 정한 순서대로 매월 한 명.</p>
    <div id="sched"><div class="empty">불러오는 중</div></div>
  </section>

  <p class="foot">HR STUDY · 모임 기록. <a href="demo/">화면 예시</a></p>
</div>

<script type="module">
  import { ready, db, esc, $, $$, fmtWon, fmtDiff, fmtDate, todayStr, members, setMembers, memberName, memberById, isAdmin, honor,
           collection, getDocs, query, orderBy } from "./assets/app.js";
  import { computeSettlement, renderSettlement } from "./assets/settle.js";
  import { computeFund, renderFund, isSplit, isFund } from "./assets/fund.js";
  import { computeSchedule, renderSchedule, loadSettings, ruleLabel, fmtMonth, ym, addMonths, monthIndex } from "./assets/schedule.js";

  // ?demo=1 이면 로그인 없이 가명 예시 데이터로 화면만 보여 준다.
  const DEMO = new URLSearchParams(location.search).get("demo") === "1";
  let me = "", today = todayStr();
  const statsEl = $("#stats");
  let sessions = [], expenses = [], payments = [], comments = [], terms = [], dues = [], settings = null;
  let f, r, sch, sessionsById = {}, commentCount = {};

  /* ---------- 탭 ---------- */
  function showTab(name, sub) {
    if (!$(`#tabs button[data-t="${name}"]`)) name = "summary";
    $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === name));
    $$("section[data-tab]").forEach(s => s.classList.toggle("on", s.dataset.tab === name));
    if (name === "months") pickMonth(sub || curMonth || ym(today), false);
    const hash = name === "summary" ? "" : "#" + name + (name === "months" && curMonth ? "/" + curMonth : "");
    if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.t); });
  document.addEventListener("click", e => { const a = e.target.closest("a[data-tab]"); if (a) { e.preventDefault(); showTab(a.dataset.tab, a.dataset.month); } });

  /* ---------- 공용 조각 ---------- */
  const won = '<small style="font-size:.875rem;font-weight:500">원</small>';
  function weekCard(s) {
    const no = String(sessions.length - sessions.indexOf(s)).padStart(2, "0");
    const upcoming = (s.date || "") >= today && !s.page;   // 아직 열리지 않은 모임(예정)
    const facts = upcoming ? [] : [`참석 <b>${(s.attendees || []).length}명</b>`];
    if (s.presenter) facts.push(`발제 <b>${esc(honor(memberName(s.presenter)))}</b>`);
    if (upcoming) { const when = [s.time, s.place].filter(Boolean).join(" · "); if (when) facts.push(esc(when)); }
    const spent = expenses.filter(x => x.sessionId === s.id).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    if (spent) facts.push(`지출 <b>${fmtWon(spent)}원</b>`);
    if (s.briefCount) facts.push(`브리프 <b>${s.briefCount}편</b>`);
    if (!upcoming) facts.push(`의견 <b>${commentCount[s.id] || 0}개</b>`);
    const tag = s.page ? "" : (upcoming ? ' <span class="tag">예정</span>' : ' <span class="tag">기록 작성 전</span>');
    const inner = `<div class="meta"><b>WEEK ${no}</b><span>${fmtDate(s.date)}</span></div>
      <h3>${esc(s.title || (upcoming ? "다음 모임" : "(제목 없음)"))}${tag}</h3>
      <div class="facts">${facts.map(x => `<span>${x}</span>`).join("")}</div>`;
    const href = DEMO ? "demo/" : `weeks/${esc(s.id)}/`;
    return s.page ? `<a class="week" href="${href}">${inner}</a>` : `<div class="week nopage">${inner}</div>`;
  }
  function settleBlocks(list) {
    // 회차별 추가 비용 정산서(참석자 n분의 1). 해당 회차가 없으면 빈 문자열.
    const wrap = document.createElement("div");
    for (const s of list.filter(s => expenses.some(x => x.sessionId === s.id && isSplit(x)))) {
      const blk = document.createElement("div"); blk.className = "settle-block";
      blk.innerHTML = `<h3>${fmtDate(s.date)} ${esc(s.title || "")}${s.page ? ` <a href="${DEMO ? "demo/" : `weeks/${esc(s.id)}/`}" style="font-weight:500;font-size:.8125rem">기록</a>` : ""}</h3><div class="body"></div>`;
      const rs = computeSettlement({ expenses: expenses.filter(x => x.sessionId === s.id), payments: payments.filter(p => p.sessionId === s.id), sessionsById, members: members() });
      renderSettlement(blk.querySelector(".body"), rs, { payments: payments.filter(p => p.sessionId === s.id), subtitle: `참석 ${(s.attendees || []).length}명`, totalLabel: "추가 비용" });
      wrap.appendChild(blk);
    }
    return wrap.innerHTML;
  }

  /* ---------- 월별 ---------- */
  let curMonth = "";
  let monthList = [];
  function buildMonthList() {
    const b = f.current?.budget;
    const cands = [ym(today), ...sessions.map(s => ym(s.date)), b?.startYm, b?.endYm].filter(Boolean);
    const lo = cands.reduce((a, x) => x < a ? x : a), hi0 = cands.reduce((a, x) => x > a ? x : a);
    const hi = hi0 > addMonths(ym(today), 2) ? hi0 : addMonths(ym(today), 2);
    monthList = [];
    for (let i = monthIndex(lo); i <= monthIndex(hi); i++) monthList.push(addMonths(lo, i - monthIndex(lo)));
  }
  function pickMonth(m, updateHash = true) {
    if (!monthList.includes(m)) m = monthList.includes(ym(today)) ? ym(today) : monthList[monthList.length - 1];
    curMonth = m;
    $("#month-pick").innerHTML = monthList.map(x => `<span class="chip${x === m ? " on" : ""}" data-m="${x}">${esc(fmtMonth(x, x.slice(0, 4) === m.slice(0, 4) ? "short" : "full"))}${x === ym(today) ? " (이달)" : ""}</span>`).join("");
    renderMonth(m);
    if (updateHash) history.replaceState(null, "", location.pathname + location.search + "#months/" + m);
  }
  $("#month-pick").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) pickMonth(c.dataset.m); });

  function renderMonth(m) {
    const root = $("#month-view");
    const inMonth = s => ym(s.date) === m;
    const ss = sessions.filter(inMonth).slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    const row = computeSchedule({ meeting: settings?.meeting, rotation: settings?.rotation, sessions, today, months: 1, from: m }).rows[0];
    const s = ss[ss.length - 1] || null;
    const status = row.status === "next" ? '<span class="tag">다음</span>' : row.status === "done" ? '<span class="tag ok">완료</span>' : row.status === "passed" ? '<span class="tag warn">기록 없음</span>' : '<span class="tag">예정</span>';
    const when = [s?.time || sch.meeting.time, s?.place || sch.meeting.place].filter(Boolean).join(" · ");
    const head = `
      <div class="st-head">
        <div class="st-total"><div class="lab">${esc(fmtMonth(m))} 모임</div><b>${fmtDate(row.date, "short")}</b>
          <span>${s ? "확정 일정" : esc(ruleLabel(sch.meeting, false))}${when ? " · " + esc(when) : ""}</span></div>
        <div class="st-rule"><div class="lab">발제 ${status}</div>
          <div class="eq">${row.presenter ? esc(honor(memberName(row.presenter))) : "미정"}${row.fromSession ? ' <span class="tag">확정</span>' : ""}</div>
          ${s ? `${esc(s.title || "제목 미정")}${s.page ? ` · <a href="${DEMO ? "demo/" : `weeks/${esc(s.id)}/`}">기록 보기</a>` : ""}<br>참석 ${(s.attendees || []).length}명 · 의견 ${commentCount[s.id] || 0}개` : "세션 없음"}</div>
      </div>`;

    // 회비: 이달 배정·이월·지출·남은 금액
    const b = f.current?.budget, br = b?.rows.find(x => x.ym === m);
    const fundBox = br
      ? `<div class="lab" style="margin-top:18px">회비 (${esc(f.current.name || "회비")})</div>
         <div class="stats mini"><div class="stat"><b>${fmtWon(br.alloc)}${won}</b><span>배정</span></div><div class="stat"><b>${fmtWon(br.carried)}${won}</b><span>이월</span></div><div class="stat"><b>${fmtWon(br.spent)}${won}</b><span>회비 지출</span></div><div class="stat"><b${br.remaining < 0 ? ' style="color:var(--danger)"' : ""}>${fmtWon(br.remaining)}${won}</b><span>남은 금액</span></div></div>`
      : `<div class="lab" style="margin-top:18px">회비</div><div class="secsub">${b ? `회비 기간(${esc(fmtMonth(b.startYm, "short"))}~${esc(fmtMonth(b.endYm))}) 밖.` : "회비 설정 없음."}</div>`;
    const mDues = dues.filter(d => ym(d.date) === m).sort((a, b2) => (a.date || "").localeCompare(b2.date || ""));
    const duesLine = mDues.length ? `<div class="secsub">이달 납부 ${mDues.length}건 · ${fmtWon(mDues.reduce((a, d) => a + (Number(d.amount) || 0), 0))}원: ${mDues.map(d => esc(memberName(d.memberId))).join(", ")}</div>` : "";

    // 지출 내역 (회비 지출 + 추가 비용)
    const mx = expenses.filter(x => ym(x.date) === m).sort((a, b2) => (a.date || "").localeCompare(b2.date || ""));
    const tot = mx.reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const items = mx.length ? `<div class="lab" style="margin-top:18px">지출 내역</div>
      <div class="st-day"><div class="hd"><b>${esc(fmtMonth(m, "short"))}</b><span class="n">${mx.length}건</span><span class="sum">${fmtWon(tot)}원</span></div>
      ${mx.map(x => `<div class="it"><span class="nm">${esc(x.item)}<small>${fmtDate(x.date, "short")} · ${esc(x.category || "")}${isFund(x) ? "" : " · n분의 1"}</small></span><span class="by">${esc(memberName(x.paidBy))}</span><span class="amt">${fmtWon(x.amount)}</span></div>`).join("")}</div>`
      : `<div class="lab" style="margin-top:18px">지출 내역</div><div class="empty">지출 없음.</div>`;

    // 추가 비용 정산서
    const blocks = settleBlocks(ss);
    root.innerHTML = head + fundBox + duesLine + items + (blocks ? `<div class="lab" style="margin-top:18px">추가 비용 정산 (참석자 n분의 1)</div>${blocks}` : "");
  }

  /* ---------- 요약 ---------- */
  function renderSummary() {
    const cur = f.current, unpaid = cur ? cur.unpaid : [];
    const latest = sessions[0];
    const nextPlan = latest?.nextPlan ? latest.nextPlan.split("\n")[0] : "";
    const nx = sch.next;
    const b = cur?.budget, bc = b?.current;
    const budgetStat = b
      ? (b.status === "before" ? `<b>${fmtWon(b.monthly)}${won}</b><span>월 가용 (${esc(fmtMonth(b.startYm, "short"))}부터, ${b.months}개월)</span>`
        : bc ? `<b${bc.remaining < 0 ? ' style="color:var(--danger)"' : ""}>${fmtWon(bc.remaining)}${won}</b><span>이달 가용 (배정 ${fmtWon(bc.alloc)}${bc.carried ? ` + 이월 ${fmtWon(bc.carried)}` : ""}${bc.spent ? ` - 지출 ${fmtWon(bc.spent)}` : ""})</span>`
        : `<b>-</b><span>회비 기간 종료</span>`)
      : `<b>-</b><span>월별 가용 금액 (회비 설정에 개월 수를 넣으면 표시)</span>`;
    const whenNext = nx?.session ? "확정" + [nx.session.time || sch.meeting.time, nx.session.place || sch.meeting.place].filter(Boolean).map(v => " · " + esc(v)).join("") : esc(ruleLabel(sch.meeting));
    statsEl.innerHTML = `
      <div class="stat"><b>${nx ? fmtDate(nx.date, "short") : "미정"}</b><span>다음 모임 · ${whenNext}${nextPlan && !nx?.session ? "<br>" + esc(nextPlan) : ""}</span></div>
      <div class="stat"><b>${nx?.presenter ? esc(honor(memberName(nx.presenter))) : "미정"}</b><span>${nx ? esc(fmtMonth(nx.ym, "short")) + " 발제" : "발제"}${nx?.index ? ` (순서 ${nx.index}/${sch.rotation.order.length})` : ""}</span></div>
      <div class="stat"><b${f.balance < 0 ? ' style="color:var(--danger)"' : ""}>${fmtWon(f.balance)}${won}</b><span>회비 잔액${cur ? ` · 납부 ${cur.paidCount}/${cur.rows.length}명` : ""}</span></div>
      <div class="stat">${budgetStat}</div>`;

    // 다음 모임 카드(일정 탭의 머리 부분만)
    const tmp = document.createElement("div");
    renderSchedule(tmp, sch, { me, nextPlan, weekHref: s => DEMO ? "demo/" : `weeks/${s.id}/` });
    $("#sum-next").innerHTML = tmp.querySelector(".st-head")?.outerHTML || "";

    // 확인할 것: 미납, 보전할 돈, 이달 정산
    const notes = [];
    if (cur && unpaid.length) notes.push(`<div class="note warn">미납 ${unpaid.length}명: ${unpaid.map(p => esc(p.name)).join(", ")} <a href="#" data-tab="fund">회비 탭</a></div>`);
    else if (cur) notes.push('<div class="note ok">회비 전원 납부 완료</div>');
    if (f.reimburseTotal) notes.push(`<div class="note">회비에서 보전할 돈 ${fmtWon(f.reimburseTotal)}원 <a href="#" data-tab="fund">회비 탭</a></div>`);
    const openSplit = sessions.filter(s => expenses.some(x => x.sessionId === s.id && isSplit(x)))
      .map(s => ({ s, rs: computeSettlement({ expenses: expenses.filter(x => x.sessionId === s.id), payments: payments.filter(p => p.sessionId === s.id), sessionsById, members: members() }) }))
      .filter(x => x.rs.transfers.length);
    for (const { s, rs } of openSplit) {
      const mine = rs.transfers.find(t => t.from === me);
      notes.push(`<div class="note">${fmtDate(s.date, "short")} ${esc(s.title || "")} 정산 남음: ${rs.transfers.length}명${mine ? ` · 내 몫 ${fmtWon(mine.amount)}원 → ${esc(memberName(mine.to))}` : ""} <a href="#" data-tab="months" data-month="${ym(s.date)}">월별 탭</a></div>`);
    }
    $("#sum-notes").innerHTML = notes.join("");

    // 최근 모임 3개
    $("#sum-count").textContent = sessions.length ? `${sessions.length}회` : "";
    $("#sum-weeks").innerHTML = sessions.length
      ? sessions.slice(0, 3).map(weekCard).join("") + (sessions.length > 3 ? `<div class="secsub" style="margin-top:6px"><a href="#" data-tab="months">월별 탭</a>에서 지난 모임을 달마다 볼 수 있음.</div>` : "")
      : `<div class="empty">기록된 모임 없음.${isAdmin() ? ' <a href="admin.html#sessions">관리 화면</a>에서 세션을 만들면 표시됨.' : ""}</div>`;
  }

  /* ---------- 시작 ---------- */
  try {
    if (DEMO) {
      // 예시 화면을 홈 화면에 추가하면 실제 사이트가 아니라 예시가 열리도록 별도 manifest를 쓴다.
      const mf = document.querySelector('link[rel="manifest"]'); if (mf) mf.href = "demo/manifest.json";
      const S = await import("./demo/sample.js");
      setMembers(S.MEMBERS); me = "a"; today = S.TODAY || today;
      sessions = S.SESSIONS; expenses = S.EXPENSES; payments = S.PAYMENTS; comments = S.COMMENTS; terms = S.TERMS; dues = S.DUES; settings = S.SETTINGS;
      $("#note").innerHTML = '<div class="note">화면 예시. 이름과 금액은 가명이며 실제 데이터 아님.</div>';
    } else {
      ({ me } = await ready());
      const [sSnap, eSnap, pSnap, cSnap, tSnap, dSnap, st] = await Promise.all([
        getDocs(query(collection(db, "sessions"), orderBy("date", "desc"))),
        getDocs(collection(db, "expenses")),
        getDocs(collection(db, "payments")),
        getDocs(collection(db, "comments")),
        getDocs(collection(db, "terms")),
        getDocs(collection(db, "dues")),
        loadSettings()
      ]);
      const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
      sessions = rows(sSnap); expenses = rows(eSnap); payments = rows(pSnap); terms = rows(tSnap); dues = rows(dSnap); settings = st;
      comments = cSnap.docs.map(d => d.data());
    }
    sessions.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    comments.forEach(c => { if (!c.deleted) commentCount[c.sessionId] = (commentCount[c.sessionId] || 0) + 1; });
    sessionsById = Object.fromEntries(sessions.map(s => [s.id, s]));
    r = computeSettlement({ expenses, payments, sessionsById, members: members() });
    f = computeFund({ terms, dues, expenses, payments, members: members(), today, splitSurplus: r.surplus });
    sch = computeSchedule({ meeting: settings?.meeting, rotation: settings?.rotation, sessions, today, months: 12 });
    window.__fund = f; window.__r = r; window.__sched = sch;

    renderSummary();
    $("#sched-sub").textContent = ruleLabel(sch.meeting);
    renderSchedule($("#sched"), sch, { me, adminHint: isAdmin() ? "admin.html" : "", weekHref: s => DEMO ? "demo/" : `weeks/${s.id}/` });
    $("#fund-sub").textContent = f.current ? `${f.current.name || ""} ${fmtWon(f.balance)}원 남음`.trim() : "";
    renderFund($("#fund"), f, { me, adminHint: isAdmin() ? "admin.html" : "" });
    buildMonthList();

    const [h, sub] = location.hash.replace("#", "").split("/");
    showTab(h || "summary", sub);
    window.addEventListener("hashchange", () => { const [h2, s2] = location.hash.replace("#", "").split("/"); showTab(h2 || "summary", s2); });
    window.__ready = true;
  } catch (ex) {
    console.error(ex);
    const msg = /insufficient permissions/i.test(ex.message || "") ? "권한 오류. 총무가 Firestore 규칙을 게시했는지 확인 필요." : esc(ex.message || ex);
    $("#note").innerHTML = `<div class="note warn">불러오기 실패: ${msg}</div>`;
    statsEl.innerHTML = "";
  }
  document.addEventListener("aro:me", () => location.reload());
</script>
</body></html>
