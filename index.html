<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAFAF7">
<link rel="manifest" href="/aro-study/manifest.json">
<link rel="apple-touch-icon" href="/aro-study/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/aro-study/assets/icons/icon-192.png">
<title>HR STUDY · 모임 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .week.nopage{cursor:default}
  .week.nopage:hover{border-color:var(--line);transform:none}
  .cum td:first-child{font-weight:700}
  .cum .plus{color:#3F6B45;font-weight:700}
  .cum .minus{color:var(--danger);font-weight:700}
</style>
</head><body>
<div id="topbar"></div>
<div class="wrap">
  <div class="kicker"><span>HR STUDY</span><span>모임 기록</span></div>
  <h1>주차별 기록, 정산, 의견</h1>
  <p class="sub">모임마다 공유한 내용과 다음 계획을 남기고, 비용은 여기서 정산합니다. 이름과 금액은 로그인한 멤버에게만 보입니다.</p>

  <div class="stats" id="stats">
    <div class="stat"><b class="soft">…</b><span>이번 달 총 지출</span></div>
    <div class="stat"><b class="soft">…</b><span>미납 인원</span></div>
    <div class="stat"><b class="soft">…</b><span>다음 모임</span></div>
  </div>

  <h2>주차 목록 <span class="cnt" id="week-count"></span></h2>
  <div id="weeks"><div class="empty">불러오는 중</div></div>

  <h2>누적 정산 <span class="cnt" id="cum-sub"></span></h2>
  <p class="secsub">모든 세션의 지출과 정산 완료 기록을 합친 결과입니다. 받을 돈은 +, 낼 돈은 -.</p>
  <div id="cum"><div class="empty">불러오는 중</div></div>

  <p class="foot">HR STUDY · 모임 기록. 새 주차는 이 목록 맨 위에 추가됩니다. <a href="demo/">화면 예시</a></p>
</div>

<script type="module">
  import { ready, db, esc, $, fmtWon, fmtDiff, fmtDate, todayStr, members, setMembers, memberName, memberById, isAdmin,
           collection, getDocs, query, orderBy } from "./assets/app.js";
  import { computeSettlement } from "./assets/settle.js";

  // ?demo=1 이면 로그인 없이 가명 예시 데이터로 화면만 보여 준다.
  const DEMO = new URLSearchParams(location.search).get("demo") === "1";
  let me = "";
  const statsEl = $("#stats"), weeksEl = $("#weeks"), cumEl = $("#cum");
  try {
    let sessions, expenses, payments, comments;
    if (DEMO) {
      const S = await import("./demo/sample.js");
      setMembers(S.MEMBERS); me = "a";
      sessions = S.SESSIONS; expenses = S.EXPENSES; payments = S.PAYMENTS; comments = S.COMMENTS;
      $(".sub").insertAdjacentHTML("afterend", '<div class="note">화면 예시입니다. 이름과 금액은 가명·예시이며 실제 데이터가 아닙니다.</div>');
    } else {
      ({ me } = await ready());
      const [sSnap, eSnap, pSnap, cSnap] = await Promise.all([
        getDocs(query(collection(db, "sessions"), orderBy("date", "desc"))),
        getDocs(collection(db, "expenses")),
        getDocs(collection(db, "payments")),
        getDocs(collection(db, "comments"))
      ]);
      sessions = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      expenses = eSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      payments = pSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      comments = cSnap.docs.map(d => d.data());
    }
    const commentCount = {};
    comments.forEach(c => { if (!c.deleted) commentCount[c.sessionId] = (commentCount[c.sessionId] || 0) + 1; });
    const sessionsById = Object.fromEntries(sessions.map(s => [s.id, s]));
    const r = computeSettlement({ expenses, payments, sessionsById, members: members() });

    // 상단 요약
    const ym = todayStr().slice(0, 7);
    const monthTotal = expenses.filter(x => (x.date || "").startsWith(ym)).reduce((a, x) => a + (Number(x.amount) || 0), 0);
    const unpaid = r.people.filter(p => p.remaining < 0);
    const latest = sessions[0];
    const next = latest?.nextPlan ? esc(latest.nextPlan).split("\n")[0] : "미정";
    statsEl.innerHTML = `
      <div class="stat"><b>${fmtWon(monthTotal)}<small style="font-size:.875rem;font-weight:500">원</small></b><span>이번 달 총 지출 (${ym.replace("-", ".")})</span></div>
      <div class="stat"><b>${unpaid.length}명</b><span>미납 인원${unpaid.length ? ": " + unpaid.map(p => esc(p.name)).join(", ") : ""}</span></div>
      <div class="stat"><b style="font-size:1rem;line-height:1.4">${next}</b><span>다음 모임${latest ? " (" + fmtDate(latest.date, "short") + " 모임에서 정한 계획)" : ""}</span></div>`;

    // 주차 목록
    $("#week-count").textContent = sessions.length ? `${sessions.length}회` : "";
    weeksEl.innerHTML = sessions.length ? sessions.map((s, i) => {
      const no = String(sessions.length - i).padStart(2, "0");
      const facts = [`참석 <b>${(s.attendees || []).length}명</b>`];
      if (s.briefCount) facts.push(`브리프 <b>${s.briefCount}편</b>`);
      facts.push(`의견 <b>${commentCount[s.id] || 0}개</b>`);
      const tag = s.page ? "" : ' <span class="tag">기록 작성 전</span>';
      const inner = `<div class="meta"><b>WEEK ${no}</b><span>${fmtDate(s.date)}</span></div>
        <h3>${esc(s.title || "(제목 없음)")}${tag}</h3>
        <div class="facts">${facts.map(f => `<span>${f}</span>`).join("")}</div>`;
      const href = DEMO ? "demo/" : `weeks/${esc(s.id)}/`;
      return s.page ? `<a class="week" href="${href}">${inner}</a>` : `<div class="week nopage">${inner}</div>`;
    }).join("") : `<div class="empty">아직 기록된 모임이 없습니다.${isAdmin() ? ' <a href="admin.html#sessions">관리 화면</a>에서 첫 세션을 만들 수 있습니다.' : ""}</div>`;

    // 누적 정산
    $("#cum-sub").textContent = r.count ? `총 ${fmtWon(r.total)}원 · ${r.count}건` : "";
    if (!r.count) cumEl.innerHTML = '<div class="empty">아직 등록된 지출이 없습니다.</div>';
    else {
      const rows = r.people.map(p => `<tr${p.id === me ? ' class="hl"' : ""}><td>${esc(p.name)}${p.isAdmin ? ' <span class="tag">총무</span>' : ""}</td>
        <td class="amt" data-label="낸 금액">${fmtWon(p.paid)}</td><td class="amt" data-label="부담액">${fmtWon(p.owed)}</td>
        <td class="amt ${p.remaining > 0 ? "plus" : p.remaining < 0 ? "minus" : ""}" data-label="남은 차액">${fmtDiff(p.remaining)}</td></tr>`).join("");
      const tr = r.transfers.length
        ? r.transfers.map(t => `<div class="tr"><span>${esc(memberName(t.from))}</span><span class="arrow">→</span><span>${esc(memberName(t.to))}</span><span class="amt">${fmtWon(t.amount)}원</span></div>`).join("")
        : '<div class="tr done"><span>남은 정산이 없습니다.</span></div>';
      cumEl.innerHTML = `
        <table class="cum"><thead><tr><th>멤버</th><th class="amt">낸 금액</th><th class="amt">부담액</th><th class="amt">남은 차액</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="lab" style="margin-top:14px">보낼 돈 (정산 완료 기록 반영 후)</div>
        <div class="st-transfers">${tr}</div>
        <div class="st-check${r.checks.owedOk ? "" : " bad"}">${r.checks.owedOk ? `합계 검산 완료 (부담액 합 ${fmtWon(r.checks.owedSum)} = 총액 ${fmtWon(r.total)})` : `부담액 합 ${fmtWon(r.checks.owedSum)} ≠ 총액 ${fmtWon(r.total)}`}${r.warnings.length ? " · " + r.warnings.map(esc).join(" · ") : ""}</div>`;
    }
  } catch (ex) {
    console.error(ex);
    const msg = /insufficient permissions/i.test(ex.message || "") ? "권한 오류입니다. 총무가 Firestore 규칙을 게시했는지 확인해 주세요." : esc(ex.message || ex);
    weeksEl.innerHTML = `<div class="note warn">불러오지 못했습니다: ${msg}</div>`;
    cumEl.innerHTML = ""; statsEl.innerHTML = "";
  }
  document.addEventListener("aro:me", () => location.reload());
</script>
</body></html>
