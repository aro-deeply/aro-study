<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F5E8E4">
<link rel="manifest" href="/aro-study/manifest.json">
<link rel="apple-touch-icon" href="/aro-study/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/aro-study/assets/icons/icon-192.png">
<title>HR STUDY</title>
<meta property="og:type" content="website">
<meta property="og:title" content="HR STUDY">
<meta property="og:url" content="https://aro-deeply.github.io/aro-study/">
<meta property="og:image" content="https://aro-deeply.github.io/aro-study/assets/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 데이터가 오기 전에는 본문 대신 안내 한 줄 */
  body.loading .body,body.loading #tile{visibility:hidden}
  #loading{display:none;padding:40px 0 10px;text-align:center;color:var(--muted-soft);font-size:.875rem;line-height:1.8}
  body.loading #loading{display:block}
  #loading .slow{display:none;font-size:.8125rem}
  #loading.slow .slow{display:block}
  .rec-more{display:none}
  .mob-only{display:none!important}
  @media (max-width:760px){.mob-only{display:flex!important}}
  .tl.all .rec-more{display:block}
</style>
</head><body class="loading">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-pin" viewBox="0 0 16 16"><path d="M8 14s5-4.2 5-8A5 5 0 0 0 3 6c0 3.8 5 8 5 8z"/><circle cx="8" cy="6" r="1.8"/></symbol>
  <symbol id="i-won" viewBox="0 0 16 16"><path d="M2 4l2.5 8L8 5l3.5 7L14 4M1.5 7.5h13"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  <symbol id="i-mic" viewBox="0 0 16 16"><rect x="5.5" y="1.8" width="5" height="8" rx="2.5"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 16 16"><path d="M8 4c-1.5-1.2-3.5-1.5-6-1.5v10c2.5 0 4.5.3 6 1.5 1.5-1.2 3.5-1.5 6-1.5v-10c-2.5 0-4.5.3-6 1.5zM8 4v10"/></symbol>
</defs></svg>

<header class="hero"><div class="w">
  <div id="topbar"></div>
  <div class="hgrid">
    <div>
      <div class="l1">조직과 사람을 읽는</div>
      <div class="l2">HR 스터디</div>
      <div class="hsub" id="hsub">&nbsp;</div>
    </div>
    <div class="event" id="tile"></div>
  </div>
</div></header>

<div class="w">
  <div id="loading">불러오는 중<span class="slow">연결이 느립니다 · 잠시 기다리거나 새로고침</span></div>
  <div id="note"></div>
  <div class="body">
    <main class="col">
      <section class="sec" data-m style="--o:2" id="next-sec">
        <h2>앞으로의 발제</h2>
        <div id="next"></div>
      </section>
      <section class="sec" data-m style="--o:3">
        <h2>지난 모임 <small id="rec-count"></small></h2>
        <div id="records"></div>
      </section>
    </main>
    <aside class="col side">
      <div id="tasks" data-m style="--o:1"></div>
      <section class="sec" data-m style="--o:4">
        <h2 class="mob-only">회비</h2>
        <div id="fund"></div>
      </section>
    </aside>
  </div>
  <div class="foot"><span>HR STUDY</span><span>조직과 사람을 읽고, 질문하고, 나누다</span></div>
</div>


<script type="module">
  import { esc, $, fmtWon, memberName, honor, avatar, activeMembers, isAdmin, toast } from "./assets/app.js";
  import { termPeriod, bindCopy } from "./assets/fund.js";
  import { ruleLabel, fmtMonth } from "./assets/schedule.js";
  import { DEMO, loadAll, dparts, ordinal, href, tasksFor, loadError } from "./assets/site.js";

  const slowTimer = setTimeout(() => $("#loading").classList.add("slow"), 8000);
  const NB = " ";   // 구분점 앞 공백(점이 줄 머리에 오지 않게)

  function renderHero(D) {
    const { sch } = D;
    const m = sch.meeting;
    const n = activeMembers().length;
    $("#hsub").textContent = [ruleLabel(m), n ? `멤버 ${n}명` : ""].filter(Boolean).join(NB + "· ");
    const nx = sch.next, tile = $("#tile");
    if (!nx) { tile.className = "event none"; tile.innerHTML = `<div class="m">다음 모임</div><div class="in"><div class="d">일정 미정</div><div class="t">정해지면 여기에 나옵니다</div></div>`; return; }
    const p = dparts(nx.date), s = nx.session, t = s?.time || m.time, place = s?.place || m.place;
    const rows = [];
    if (s?.title) rows.push(`<div class="row1"><svg class="i"><use href="#i-book"/></svg><span>${esc(s.title)}</span></div>`);
    if (place) rows.push(`<div class="row1"><svg class="i"><use href="#i-pin"/></svg><span>${esc(place)}</span></div>`);
    rows.push(nx.presenter
      ? `<div class="row1">${avatar(nx.presenter, "sm")}<span>발제 ${esc(honor(memberName(nx.presenter)))}</span></div>`
      : `<div class="row1"><svg class="i"><use href="#i-mic"/></svg><span>발제 미정</span></div>`);
    tile.innerHTML = `<div class="m">${nx.date === D.today ? "오늘 모임" : "다음 모임"}</div>
      <div class="in"><div class="d num">${p.m}월 ${p.d}일</div><div class="t">${p.w}요일${t ? ` <b>${esc(t)}</b>` : ""}</div>
      <div class="rows">${rows.join("")}</div></div>`;
  }

  /** 다음 모임 이후의 발제 순서(날짜 배지 + 발제자). 없으면 섹션을 숨긴다. */
  function renderNext(D) {
    const { sch } = D, nx = sch.next;
    const later = nx ? sch.rows.filter(r => r.date > nx.date).slice(0, 3) : [];
    if (!later.length) { $("#next-sec").remove(); return; }
    $("#next").innerHTML = `<div class="queue">${later.map(r => { const p = dparts(r.date); return `
      <div class="q-item"><span class="tile date sm"><span>${p.m}월</span><b class="num">${p.d}</b></span>
        <div class="tx"><b>${r.presenter ? `발제 ${esc(honor(memberName(r.presenter)))}` : "발제 미정"}</b><span>${p.w}요일${(r.session?.time || sch.meeting.time) ? " " + esc(r.session?.time || sch.meeting.time) : ""}</span></div></div>`; }).join("")}</div>`;
  }

  function recordCard(D, s, no) {
    const p = dparts(s.date);
    const att = s.attendees || [];
    const shown = att.slice(0, 6).map(id => avatar(id, "", true)).join("");
    const cc = D.commentCount[s.id] || 0;
    const facts = [att.length ? `참석 ${att.length}명` : "", cc ? `의견 ${cc}개` : ""].filter(Boolean).join(NB + "· ");
    const inner = `<h3>${esc(s.title || "(제목 없음)")}</h3>
      ${s.presenter ? `<div class="by">${avatar(s.presenter, "sm")}발제 ${esc(honor(memberName(s.presenter)))}</div>` : ""}
      <div class="ft"><span class="stack">${shown}${att.length > 6 ? `<span class="av">+${att.length - 6}</span>` : ""}${facts ? `<em>${facts}</em>` : ""}</span>
        ${s.page ? '<span class="golink">기록 보기 &rarr;</span>' : '<span class="pending">기록 작성 전</span>'}</div>`;
    return `<div class="dh">${p ? `${p.m}월 ${p.d}일<small>${p.w}요일</small>` : esc(s.date || "")}</div>
      ${s.page ? `<a class="rc" href="${href.week(s)}">${inner}</a>` : `<div class="rc">${inner}</div>`}`;
  }

  function renderRecords(D) {
    const held = D.sessions.filter(s => (s.date || "") < D.today || s.page);   // 지난 모임(기록 페이지가 있으면 포함)
    const asc = held.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    $("#rec-count").textContent = held.length ? `${held.length}회` : "";
    if (!held.length) { $("#records").innerHTML = `<div class="card"><div class="empty">아직 지난 모임 기록이 없습니다</div></div>`; return; }
    const cards = held.map((s, i) => `<div class="${i >= 3 ? "rec-more" : ""}">${recordCard(D, s)}</div>`).join("");
    $("#records").innerHTML = `<div class="tl" id="tl">${cards}</div>${held.length > 3 ? `<button type="button" class="more-btn" id="rec-all">지난 모임 ${held.length}회 모두 보기</button>` : ""}`;
    $("#rec-all")?.addEventListener("click", e => { $("#tl").classList.add("all"); e.currentTarget.remove(); });
  }

  function renderTasks(D) {
    const list = tasksFor(D);
    const root = $("#tasks");
    if (!list.length) { root.innerHTML = ""; root.style.display = "none"; return; }
    root.innerHTML = `<div class="callout"><div class="ttl">내가 할 일</div>
      ${list.map(t => `<div class="task"><b class="num">${t.title}</b><p>${t.desc}</p>${t.acct ? `<p class="acct">${t.acct}</p>` : ""}${t.link ? `<a class="tlink" href="${t.link}">${t.linkLabel || "기록 보기"} &rarr;</a>` : ""}${t.action}</div>`).join("")}</div>`;
    bindCopy(root);
  }

  function renderFundPanel(D) {
    const { f } = D, t = f.current, root = $("#fund");
    if (!t && !f.duesCount && !f.fundExpenses.length) {
      root.innerHTML = `<div class="panel"><div class="top"><span>회비</span><small>회비 설정 없음${isAdmin() ? ' · <a href="admin.html#dues">관리</a>에서 설정' : ""}</small></div></div>`; return;
    }
    const b = t?.budget, c = b?.current;
    let line = "", monthRow = "";
    if (c) {
      const avail = c.carried + c.alloc;
      const pct = avail > 0 ? Math.min(100, Math.max(0, c.spent / avail * 100)) : (c.spent > 0 ? 100 : 0);
      const [, mm] = c.ym.split("-").map(Number);
      line = `<div class="bar${c.remaining < 0 ? " over" : ""}"><i style="width:${pct.toFixed(1)}%"></i></div>
        <small class="num">${mm}월 예산 ${fmtWon(avail)}원${c.carried > 0 ? `(이월 ${fmtWon(c.carried)}원 포함)` : ""} 중 ${fmtWon(c.spent)}원 씀</small>`;
      monthRow = `<div class="pr"><span>${mm}월에 더 쓸 수 있는 돈</span><span class="v num${c.remaining < 0 ? " unpaid" : ""}">${c.remaining >= 0 ? `${fmtWon(c.remaining)}원` : `${fmtWon(-c.remaining)}원 초과`}</span></div>`;
    } else if (b?.status === "before") line = `<small class="num">${esc(fmtMonth(b.startYm))}부터 매달 ${fmtWon(b.monthly)}원</small>`;
    else if (t) line = `<small>${esc(termPeriod(t).replace(" ~ ", NB + "~" + NB))}</small>`;
    const rows = [];
    if (monthRow) rows.push(monthRow);
    if (t) rows.push(t.unpaid.length
      ? `<div class="pr"><span>아직 안 낸 사람</span><span>${t.unpaid.map(u => `<span class="unpaid">${esc(u.name)}</span>`).join(" ")}</span></div>`
      : `<div class="pr"><span>납부</span><span class="ok">${t.paidCount}/${t.rows.length}명 모두 냄</span></div>`);
    if (f.reimburseTotal) rows.push(`<div class="pr"><span>회비에서 돌려줄 돈</span><span class="v num">${fmtWon(f.reimburseTotal)}원</span></div>`);
    rows.push(`<a class="pr more" href="${href.fund()}"><span>달별 내역${NB}· 납부 현황${NB}· 계좌</span><svg class="i"><use href="#i-arrow"/></svg></a>`);
    root.innerHTML = `<div class="panel"><div class="top"><span>지금 남은 회비</span><b class="num${f.balance < 0 ? " neg" : ""}">${fmtWon(f.balance)}원</b>${line}</div>${rows.join("")}</div>`;
  }

  try {
    const D = await loadAll();
    const nt = D.settings?.notice;
    if (!DEMO && nt?.text && (!nt.until || D.today <= nt.until)) $("#note").innerHTML = `<div class="notice"><b>공지</b>${esc(nt.text)}</div>`;
    if (DEMO) $("#note").innerHTML = `<div class="notice"><b>화면 예시</b>이름과 금액은 가명입니다.<br>멤버B로 접속했다고 가정한 화면입니다.</div>`;
    renderHero(D); renderTasks(D); renderNext(D); renderRecords(D); renderFundPanel(D);
    window.__ready = true;
  } catch (ex) {
    $("#note").innerHTML = `<div class="note warn">불러오기 실패: ${loadError(ex)}</div>`;
  } finally {
    clearTimeout(slowTimer);
    document.body.classList.remove("loading");
  }
  document.addEventListener("aro:me", () => location.reload());
</script>
</body></html>
